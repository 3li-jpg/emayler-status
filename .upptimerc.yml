owner: 3li-jpg
repo: emayler-status

# Checks run from GitHub Actions every 5 minutes. GitHub's runners cannot
# reach port 25, so inbound mail is checked through an HTTPS health URL on the
# API once it is deployed (added separately).
sites:
  - name: Website
    url: https://emayler.com
  - name: Web app
    url: https://app.emayler.com/login
  - name: API
    url: https://api.emayler.com/v1/me
    expectedStatusCodes:
      - 401
  - name: MCP server
    url: https://mcp.emayler.com/mcp
    expectedStatusCodes:
      - 405

status-website:
  cname: status.emayler.com
  logoUrl: https://emayler.com/icon.svg
  favicon: https://emayler.com/icon.svg
  faviconSvg: https://emayler.com/icon.svg
  name: Emayler status
  introTitle: "Emayler status"
  introMessage: "Live checks of the Emayler website, web app, API and MCP server, every five minutes."
  navbar:
    - title: Status
      href: /
    - title: Emayler
      href: https://emayler.com
  # Emayler look: tokens copied from apps/marketing/app/globals.css (light is
  # :root.light there, dark is :root). html:root outranks Upptime's own theme
  # files, which load after this. Sharp corners, Inter, monochrome; red only
  # for outages and amber for degraded.
  customHeadHtml: |
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <style>
      html:root {
        --em-bg: #f3f4f3; --em-panel: #ffffff; --em-fg: #202624; --em-strong: #19211d;
        --em-dim: #5b6660; --em-border: #d9dddb; --em-border-soft: #e4e7e5;
        --body-background-color: var(--em-bg); --body-text-color: var(--em-fg);
        --card-background-color: var(--em-panel); --card-border-color: var(--em-border);
        --nav-background-color: var(--em-bg); --nav-border-bottom-color: var(--em-border);
        --nav-current-border-bottom-color: var(--em-strong);
        --up-border-left-color: var(--em-strong); --down-border-left-color: #c0392b;
        --down-background-color: #f6e3e1; --degraded-border-left-color: #b7791f;
        --tag-color: #ffffff; --tag-up-background-color: var(--em-strong);
        --tag-down-background-color: #c0392b; --tag-degraded-background-color: #b7791f;
        --change-background-color: #b7791f;
        --error-button-border-color: var(--em-strong); --error-button-background-color: var(--em-strong); --error-button-color: var(--em-bg);
        --submit-button-border-color: var(--em-strong); --submit-button-background-color: var(--em-strong); --submit-button-color: var(--em-bg);
        --graph-opacity: 0.35; --graph-filter: grayscale(1);
      }
      @media (prefers-color-scheme: dark) {
        html:root {
          --em-bg: #191c1d; --em-panel: #222627; --em-fg: #edf0ef; --em-strong: #f5f6f5;
          --em-dim: #b8bfbc; --em-border: #3d4343; --em-border-soft: #303637;
          --down-border-left-color: #e5675a; --down-background-color: #3a2422;
          --degraded-border-left-color: #d9a441; --tag-color: #191c1d;
          --tag-down-background-color: #e5675a; --tag-degraded-background-color: #d9a441;
          --graph-opacity: 0.3;
        }
      }
      body { font-family: Inter, system-ui, -apple-system, sans-serif; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
      article, .tag, a.error-button, .submit-button, input, button, img { border-radius: 0 !important; }
      article { box-shadow: none; }
      article + article { margin-top: -1px; }
      h1, h2 { font-weight: 500; letter-spacing: -0.03em; color: var(--em-strong); }
      h1 { font-size: 2.25em; }
      h3 { opacity: 1; color: var(--em-dim); font-weight: 400; }
      h4 { font-weight: 500; color: var(--em-strong); }
      nav { font-size: 14px; }
      nav a { text-decoration: none; color: var(--em-dim); }
      nav [aria-current] { color: var(--em-strong); }
      article dl, article p, article div { color: var(--em-dim); }
      a { text-underline-offset: 3px; }
      /* Upptime paints its teal response-time PNG as the card background.
         Repaint it on a greyscale layer behind the text. isolation keeps the
         layer above the card colour; the full-card link still works. */
      article.graph { background-image: none !important; isolation: isolate; }
      article.graph::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
        background-image: var(--background); background-size: contain; background-repeat: no-repeat;
        background-position: right center; filter: grayscale(1) contrast(1.4); opacity: var(--graph-opacity); }
      @media (prefers-color-scheme: dark) { article.graph::before { filter: grayscale(1) invert(1) contrast(1.2); } }
    </style>
