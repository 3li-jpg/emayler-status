owner: 3li-jpg
repo: emayler-status

# Checks run from GitHub Actions every 5 minutes. GitHub's runners cannot
# reach port 25, so inbound mail is checked through an HTTPS health URL on the
# API once it is deployed (added separately).
sites:
  - name: Website
    url: https://emayler.com
  - name: Web app
    url: https://app.emayler.com/login
  - name: API
    url: https://api.emayler.com/v1/me
    expectedStatusCodes:
      - 401
  - name: MCP server
    url: https://mcp.emayler.com/mcp
    expectedStatusCodes:
      - 405

status-website:
  cname: status.emayler.com
  logoUrl: https://emayler.com/icon.svg
  name: Emayler status
  introTitle: "Emayler status"
  introMessage: "Live checks of the Emayler website, web app, API and MCP server, every five minutes."
  navbar:
    - title: Status
      href: /
    - title: Emayler
      href: https://emayler.com
